services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosy-pocket-builder
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # Application
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0

      # Self-Repair Loop
      - SELF_REPAIR_ENABLED=true
      - MAX_REPAIR_RETRIES=2
      - VALIDATION_TIMEOUT_MS=5000
      - VALIDATION_STRATEGY=auto
      - BROWSER_POOL_SIZE=2
      - VALIDATION_MAX_HTML_SIZE=500000

      # AI Providers
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Authentication & WordPress Connector
      - VITE_AUTH_ENABLED=${VITE_AUTH_ENABLED:-true}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://cozy.h4ck3d.me}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - WORDPRESS_ENCRYPTION_KEY=${WORDPRESS_ENCRYPTION_KEY}
      - PGLITE_DATA_DIR=${PGLITE_DATA_DIR:-/app/data/pglite}
      - DATABASE_URL=${DATABASE_URL}

      # Optional: Redis for rate limiting
      - REDIS_URL=redis://redis:6379
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 1.5
    volumes:
      # Persistent data
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/validationHealth"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: cosy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: cosy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cosy}
      POSTGRES_USER: ${POSTGRES_USER:-cosy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cosy} -d ${POSTGRES_DB:-cosy}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: cosy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - EMAIL=${EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

volumes:
  redis-data:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  app-network:
    driver: bridge
